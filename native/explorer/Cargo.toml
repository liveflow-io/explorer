[package]
name = "explorer"
# We don't use versioning in the in this crate.
# Please check the `mix.exs` file at the root of this project for the current version.
version = "0.1.0"
authors = []
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "explorer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10"
either = "1"
rand = { version = "0.8", features = ["alloc"] }
rand_pcg = "0.3"
reqwest = { version = "0.12", default-features = false }
rustler = { version = "0.36" }
thiserror = "2"

object_store = { version = "0.13", default-features = false, optional = true }
polars-arrow = "0.54.4"
polars-lazy = "0.54.4"
polars-parquet = "0.54.4"

[dependencies.tokio]
version = "1.40"
default-features = false
features = ["rt"]
optional = true

[dependencies.polars]
version = "0.54.4"
default-features = false
features = [
  "abs",
  "asof_join",
  "checked_arithmetic",
  "concat_str",
  "cov",
  "cross_join",
  "csv",
  "cum_agg",
  "cutqcut",
  "decompress",
  "describe",
  "dtype-full",
  "ewma",
  "extract_groups",
  "extract_jsonpath",
  "index_of",
  "ipc",
  "ipc_streaming",
  "is_in",
  "lazy",
  "log",
  "mode",
  "moment",
  "object",
  "parquet",
  "peaks",
  "performant",
  "pivot",
  "product",
  "propagate_nans",
  "random",
  "range",
  "rank",
  "regex",
  "rolling_window",
  "round_series",
  "rows",
  "search_sorted",
  "simd",
  "sql",
  "strings",
  "temporal",
  "timezones",
  "to_dummies",
  "trigonometry",
]

[dependencies.polars-ops]
version = "0.54.4"
features = ["abs", "cov", "cum_agg", "ewma", "index_of"]

# MiMalloc won´t compile on Windows with the GCC compiler.
# On Linux with Musl it won´t load correctly.
[target.'cfg(not(any(all(windows, target_env = "gnu"), all(target_os = "linux", target_env = "musl"))))'.dependencies]
mimalloc = { version = "*", default-features = false }

[features]
default = ["cloud", "ndjson", "nif_version_2_15"]

aws = ["object_store/aws", "polars/async", "polars/aws"]
cloud = ["aws", "object_store", "polars/cloud", "tokio"]
ndjson = ["polars/json"]

# Feature necessary for Rustler Precompiled.
nif_version_2_15 = ["rustler/nif_version_2_15"]
